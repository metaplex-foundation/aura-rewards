[package]
name = "mplx-rewards"
version = "0.1.0"
edition = "2021"

[dependencies]
solana-program = "2.1.4"
spl-token = { version = "7", features = ["no-entrypoint"] }
borsh = { version = "1.5", features = ["derive"] }
bytemuck = { version = "1.20.0", features = ["derive"] }
num-derive = "0.4"
num-traits = "0.2"
thiserror = "2"
shank = "0.4"
lib-sokoban = "0.3"

[dev-dependencies]
solana-program-test = "2.1.4"
solana-sdk = "2.1.4"

[lib]
crate-type = ["cdylib", "lib"]

[[test]]
name = "integration_tests"
path = "tests/rewards/tests.rs"

[features]
no-entrypoint = []
testing = []
